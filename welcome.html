<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bem-vindo · ML Painel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --bg2:     #161b27;
      --bg3:     #1e2535;
      --border:  rgba(255,255,255,0.08);
      --text:    #e2e8f0;
      --muted:   #64748b;
      --muted2:  #94a3b8;
      --accent:  #FFE600;
      --green:   #22c55e;
      --blue:    #3b82f6;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── BACKGROUND GRID ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── GLOW ── */
    .glow {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -60%);
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,230,0,0.07) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── MAIN ── */
    .wrap {
      position: relative; z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    /* ── LOGO ── */
    .logo {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.1s forwards;
    }
    .logo-badge {
      width: 40px; height: 40px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .logo-name { font-size: 16px; font-weight: 600; color: var(--text); }
    .logo-sub  { font-size: 11px; color: var(--muted); }

    /* ── AVATAR ── */
    .avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--bg2);
      border: 2px solid rgba(255,230,0,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin: 0 auto 1.5rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.2s forwards;
    }

    /* ── TEXTS ── */
    .greeting {
      font-size: 13px;
      color: var(--muted2);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.3s forwards;
    }

    .welcome-title {
      font-size: 36px;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 12px;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.4s forwards;
    }
    .welcome-title span { color: var(--accent); }

    .welcome-sub {
      font-size: 14px;
      color: var(--muted2);
      line-height: 1.7;
      max-width: 420px;
      margin: 0 auto 2.5rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.5s forwards;
    }

    /* ── STATS ROW ── */
    .stats {
      display: flex;
      gap: 1px;
      background: var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.6s forwards;
    }
    .stat {
      flex: 1;
      background: var(--bg2);
      padding: 14px 20px;
    }
    .stat-val  { font-size: 20px; font-weight: 600; color: var(--text); font-family: 'DM Mono', monospace; }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .stat-val.green { color: var(--green); }
    .stat-val.amber { color: var(--accent); }

    /* ── BUTTON ── */
    .btn-enter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 32px;
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.01em;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.75s forwards;
    }
    .btn-enter:hover  { opacity: 0.88; }
    .btn-enter:active { transform: scale(0.97); }
    .btn-arrow { transition: transform 0.2s; }
    .btn-enter:hover .btn-arrow { transform: translateX(3px); }

    /* ── LOGIN TIME ── */
    .login-info {
      margin-top: 1.75rem;
      font-size: 11px;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 0.6s ease 0.85s forwards;
    }

    /* ── LOGOUT ── */
    .btn-logout {
      position: fixed;
      top: 1.25rem; right: 1.5rem;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted2);
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      padding: 6px 14px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      z-index: 10;
    }
    .btn-logout:hover { border-color: var(--border2); color: var(--text); }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="glow"></div>

<button class="btn-logout" id="btnLogout">↩ Sair</button>

<div class="wrap">

  <div class="logo">
    <div class="logo-badge">🛒</div>
    <div>
      <div class="logo-name">ML Painel</div>
      <div class="logo-sub">Mercado Livre · Analytics</div>
    </div>
  </div>

  <div class="avatar" id="avatarEl">👤</div>

  <div class="greeting">Bem-vindo de volta</div>

  <div class="welcome-title">
    Olá, <span id="userName">usuário</span>! 👋
  </div>

  <div class="welcome-sub">
    Seu painel está pronto com os dados mais recentes do marketplace.
    Acompanhe vendas, metas e resultados em tempo real.
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-val amber">R$ 1,77M</div>
      <div class="stat-label">Total vendas</div>
    </div>
    <div class="stat">
      <div class="stat-val green">40,0%</div>
      <div class="stat-label">Margem média</div>
    </div>
    <div class="stat">
      <div class="stat-val">677</div>
      <div class="stat-label">Unidades vendidas</div>
    </div>
    <div class="stat">
      <div class="stat-val">15</div>
      <div class="stat-label">Meses de dados</div>
    </div>
  </div>

  <button class="btn-enter" id="btnEnter">
    Acessar o painel <span class="btn-arrow">→</span>
  </button>

  <div class="login-info" id="loginInfo">Último acesso: —</div>

</div>

<script>
  // Verifica sessão
  const raw = sessionStorage.getItem('ml_user');
  if (!raw) {
    window.location.href = 'login.html';
  }

  const user = JSON.parse(raw || '{}');

  // Preenche nome
  const name     = user.name || user.email || 'usuário';
  const nameDisp = name.charAt(0).toUpperCase() + name.slice(1);
  document.getElementById('userName').textContent = nameDisp;

  // Avatar com inicial
  const avatarEl = document.getElementById('avatarEl');
  avatarEl.textContent = nameDisp.charAt(0).toUpperCase();
  avatarEl.style.fontSize = '26px';
  avatarEl.style.fontWeight = '600';
  avatarEl.style.color = '#0d1117';
  avatarEl.style.background = 'var(--accent)';

  // Data/hora do login
  if (user.loginAt) {
    const dt = new Date(user.loginAt);
    document.getElementById('loginInfo').textContent =
      'Acesso em ' + dt.toLocaleDateString('pt-BR') + ' às ' + dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  // Ir para o painel
  document.getElementById('btnEnter').addEventListener('click', () => {
    window.location.href = 'index.html';
  });

  // Logout
  document.getElementById('btnLogout').addEventListener('click', () => {
    sessionStorage.removeItem('ml_user');
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
